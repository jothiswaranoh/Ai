<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="droneGrad" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="30" y1="30" x2="70" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded shield / backdrop (for favicon clarity) -->
  <rect width="100" height="100" rx="24" fill="#091510" />
  <rect x="2" y="2" width="96" height="96" rx="22" stroke="url(#droneGrad)" stroke-width="2" stroke-opacity="0.3" />

  <!-- 4 Drone Diagonal Arms -->
  <line x1="28" y1="28" x2="72" y2="72" stroke="url(#droneGrad)" stroke-width="6" stroke-linecap="round" />
  <line x1="72" y1="28" x2="28" y2="72" stroke="url(#droneGrad)" stroke-width="6" stroke-linecap="round" />

  <!-- Rotor Guards / Propeller Rings -->
  <!-- Top Left -->
  <circle cx="24" cy="24" r="14" stroke="#34d399" stroke-width="2.5" stroke-dasharray="14 6" opacity="0.85" />
  <ellipse cx="24" cy="24" rx="10" ry="3" fill="#6ee7b7" transform="rotate(-30 24 24)" />
  <circle cx="24" cy="24" r="4.5" fill="#022c22" stroke="#34d399" stroke-width="2" />

  <!-- Top Right -->
  <circle cx="76" cy="24" r="14" stroke="#34d399" stroke-width="2.5" stroke-dasharray="14 6" opacity="0.85" />
  <ellipse cx="76" cy="24" rx="10" ry="3" fill="#6ee7b7" transform="rotate(30 76 24)" />
  <circle cx="76" cy="24" r="4.5" fill="#022c22" stroke="#34d399" stroke-width="2" />

  <!-- Bottom Left -->
  <circle cx="24" cy="76" r="14" stroke="#34d399" stroke-width="2.5" stroke-dasharray="14 6" opacity="0.85" />
  <ellipse cx="24" cy="76" rx="10" ry="3" fill="#6ee7b7" transform="rotate(30 24 76)" />
  <circle cx="24" cy="76" r="4.5" fill="#022c22" stroke="#34d399" stroke-width="2" />

  <!-- Bottom Right -->
  <circle cx="76" cy="76" r="14" stroke="#34d399" stroke-width="2.5" stroke-dasharray="14 6" opacity="0.85" />
  <ellipse cx="76" cy="76" rx="10" ry="3" fill="#6ee7b7" transform="rotate(-30 76 76)" />
  <circle cx="76" cy="76" r="4.5" fill="#022c22" stroke="#34d399" stroke-width="2" />

  <!-- Central Drone Body / Fuselage -->
  <rect x="37" y="37" width="26" height="26" rx="8" fill="url(#bodyGrad)" stroke="#34d399" stroke-width="2.5" />
  
  <!-- Precision Camera / Agri Radar Sensor Eye -->
  <circle cx="50" cy="50" r="7" fill="#059669" />
  <circle cx="50" cy="50" r="4" fill="#6ee7b7" />
  <circle cx="51.5" cy="48.5" r="1.5" fill="#ffffff" />

  <!-- Agricultural Spray Indicators (Subtle spray mist dots at bottom) -->
  <circle cx="44" cy="70" r="1.5" fill="#34d399" opacity="0.8" />
  <circle cx="50" cy="73" r="2" fill="#6ee7b7" opacity="0.9" />
  <circle cx="56" cy="70" r="1.5" fill="#34d399" opacity="0.8" />
</svg>
